    <text x="0" y="350" class="dim">$ cat contact.info</text>
    <text x="0" y="372" class="key">Grid.GitHub</text><text x="180" y="372" class="val">sibnarayansamanta7-boop</text>
    <text x="0" y="394" class="key">Grid.LinkedIn</text><text x="180" y="394" class="dim">coming soon</text>

    <text x="0" y="416" class="live">● More about me &amp; projects below — README.md</text>
