<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <style>
      .win { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .bar { fill: #161b22; }
      .dot { r: 6; }
      .path { fill: #7d8590; font-size: 12px; }
      .label { fill: #7ee787; font-size: 13px; }
      .key { fill: #79c0ff; font-size: 13px; }
      .val { fill: #c9d1d9; font-size: 13px; }
      .dim { fill: #6e7681; font-size: 13px; }
      .section { fill: #ff7b72; font-size: 13px; font-weight: bold; }
      .live { fill: #7ee787; font-size: 11px; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="440" rx="10" class="win"/>
  <rect x="0" y="0" width="760" height="34" rx="10" class="bar"/>
  <rect x="0" y="24" width="760" height="10" class="bar"/>

  <circle cx="22" cy="17" class="dot" fill="#ff5f56"/>
  <circle cx="42" cy="17" class="dot" fill="#ffbd2e"/>
  <circle cx="62" cy="17" class="dot" fill="#27c93f"/>

  <text x="200" y="21" class="path" text-anchor="middle">sibnarayansamanta7-boop@github: ~/profile.sh --live</text>

  <!-- body -->
