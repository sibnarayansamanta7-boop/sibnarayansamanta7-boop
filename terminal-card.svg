    <text x="0" y="104" class="key">Focus</text><text x="180" y="104" class="val">Full-Stack Development</text>
    <text x="0" y="126" class="key">Education</text><text x="180" y="126" class="val">B.Tech CSE — 3rd Year</text>
    <text x="0" y="148" class="key">Status</text><text x="180" y="148" class="val">Strengthening Java, DSA &amp; CS fundamentals</text>
    <text x="0" y="170" class="key">Toolchain</text><text x="180" y="170" class="val">VS Code, Git, IntelliJ IDEA, Android Studio</text>

    <rect x="0" y="188" width="700" height="1" fill="#21262d"/>

    <text x="0" y="216" class="dim">$ stack --list</text>
    <text x="0" y="238" class="key">Core.Lang</text><text x="180" y="238" class="val">Java, C, Python, JavaScript</text>
    <text x="0" y="260" class="key">Core.Frontend</text><text x="180" y="260" class="val">React, HTML5, CSS3, Vite</text>
    <text x="0" y="282" class="key">Core.Backend</text><text x="180" y="282" class="val">Node.js, Express.js</text>
    <text x="0" y="304" class="key">Core.Database</text><text x="180" y="304" class="val">MongoDB</text>

